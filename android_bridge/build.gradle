plugins {
    id 'com.android.application'
}

android {
    namespace 'com.teleprompter.bridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.teleprompter.bridge"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Cliente WebSocket de alto rendimiento para conexión con Laptop
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Huawei Wear Engine SDK para comunicación Bluetooth P2P con Watch Fit 3
    // Disponible en el repositorio de Huawei Maven: https://developer.huawei.com/repo/
    implementation 'com.huawei.hms:wearengine:5.0.2.301'
    
    // Parser JSON
    implementation 'com.google.code.gson:gson:2.10.1'
}
